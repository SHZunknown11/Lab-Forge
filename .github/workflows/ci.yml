name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests, lint, frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        run: |
          pip install -e ".[server,dev]"
          python scripts/setup_runtime.py --mongo
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
        env:
          AI_MODE: local
          LABFORGE_TEST_DATABASE_URL: postgresql://postgres:ci@127.0.0.1:5432/postgres
      - name: Frontend
        working-directory: apps/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run build

  image:
    name: Production image + smoke test
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: labforge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start
        run: |
          docker run -d --name lf -p 7860:7860 -e AI_MODE=local -e LABFORGE_ADMIN_TOKEN=ci labforge:ci
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:7860/api/health && break; sleep 2; done
          curl -fs -H "X-Admin-Token: ci" "http://127.0.0.1:7860/api/admin/status"; echo
          docker image ls labforge:ci
      - name: Smoke test (every runtime, Word + PDF)
        run: python3 scripts/smoke_test.py http://127.0.0.1:7860
        env:
          LABFORGE_ADMIN_TOKEN: ci
      - name: Secrets are not readable by student programs
        run: |
          docker exec -u 1000 lf sh -c 'cat /proc/1/environ' && exit 1 || echo "server environment is private"
      - name: Logs
        if: always()
        run: docker logs lf 2>&1 | tail -80
      - name: Diagnose runtimes
        if: failure()
        run: |
          docker exec lf /app/.runtime/mongodb/mongod --version || true
          docker exec lf sh -c 'mkdir -p /tmp/m && timeout 10 /app/.runtime/mongodb/mongod --dbpath /tmp/m --port 27999 --bind_ip 127.0.0.1 2>&1 | tail -5' || true
          docker exec lf sh -c 'ls -la /app/.runtime/node/node_modules | grep -i mongo' || true
