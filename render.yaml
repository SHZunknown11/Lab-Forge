# Render Blueprint: one free web service built from the Dockerfile.
# scripts/deploy_render.py does the same through Render's API and copies keys from .env.
services:
  - type: web
    name: labforge
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      # AI keys: fill in at least one.
      - key: GEMINI_API_KEY
        sync: false
      - key: CLOUDFLARE_AI_KEY
        sync: false
      - key: CLOUDFLARE_BASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: AI_PROVIDERS
        value: gemini,cloudflare,groq,cerebras,openrouter,mistral,github
      - key: LABFORGE_ADMIN_TOKEN
        generateValue: true
      # Postgres (e.g. Neon) for the draft cache, rate limits and the /admin activity log.
      # The free disk is wiped on every restart, so without it all of that is lost each deploy.
      # LABFORGE_LOG_DB_URL (the old name) still works.
      - key: LABFORGE_DATABASE_URL
        sync: false
      - key: LABFORGE_PUBLIC_URL
        sync: false
      # Accounts: sign-in codes by email (docs/deployment.md). Render's free plan blocks SMTP
      # ports, so use Resend here. Until a mail key is set, turn sign-in off with
      # LABFORGE_REQUIRE_LOGIN=0, or nobody can write a report.
      - key: LABFORGE_REQUIRE_LOGIN
        value: "1"
      - key: LABFORGE_EMAIL_DOMAINS
        value: cuchd.in
      - key: LABFORGE_FREE_REPORTS
        value: "3"
      - key: LABFORGE_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: LABFORGE_MAIL_FROM
        sync: false
      # Programs run on a separate worker machine (apps/worker), not on this server.
      # Until a worker exists, leave EXEC_BACKEND unset (local) and see docs/security.md.
      - key: EXEC_BACKEND
        sync: false
      - key: EXEC_WORKER_URL
        sync: false
      - key: EXEC_WORKER_TOKEN
        sync: false
      - key: ADSENSE_CLIENT
        sync: false
      - key: VITE_ADSENSE_CLIENT
        sync: false
      - key: VITE_CONTACT_EMAIL
        sync: false
      - key: SENTRY_DSN
        sync: false
      # Your LinkedIn/GitHub/portfolio URLs, comma-separated (docs/seo.md).
      - key: LABFORGE_AUTHOR_LINKS
        sync: false
      - key: VITE_AUTHOR_LINKS
        sync: false
      # The free instance has 512 MB and a tenth of a CPU: one heavy process at a time,
      # five times the usual timeouts.
      - key: LABFORGE_MAX_PARALLEL_RUNS
        value: "1"
      - key: LABFORGE_TIMEOUT_SCALE
        value: "5"
      - key: LABFORGE_TRUST_PROXY
        value: "1"
      # Set by Cloudflare in front of Render; visitors can't forge it.
      - key: LABFORGE_CLIENT_IP_HEADER
        value: true-client-ip
