services:
  labforge:
    build:
      context: .
      args:
        VITE_ADSENSE_CLIENT: ${VITE_ADSENSE_CLIENT:-}
        VITE_ADSENSE_SLOT_RAIL: ${VITE_ADSENSE_SLOT_RAIL:-}
        VITE_ADSENSE_SLOT_BENCH: ${VITE_ADSENSE_SLOT_BENCH:-}
        VITE_ADSENSE_SLOT_WAIT: ${VITE_ADSENSE_SLOT_WAIT:-}
        VITE_REWARDED_AD_UNIT: ${VITE_REWARDED_AD_UNIT:-}
        VITE_CONTACT_EMAIL: ${VITE_CONTACT_EMAIL:-}
        # MATLAB sheets through GNU Octave: WITH_OCTAVE=1 docker compose build
        WITH_OCTAVE: ${WITH_OCTAVE:-0}
    env_file: .env
    environment:
      PDF_BACKEND: gotenberg
      GOTENBERG_URL: http://gotenberg:3000
      LABFORGE_TRUST_PROXY: "1"
    ports:
      - "8000:8000"
    volumes:
      - labforge-data:/app/artifacts
    # Student programs run inside this container: keep it small and contained.
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    read_only: false
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on: [gotenberg]

  # Optional: run student programs in a separate container with no secrets.
  # Set EXEC_BACKEND=remote, EXEC_WORKER_URL=http://worker:8100 and EXEC_WORKER_TOKEN in .env,
  # then: docker compose --profile worker up -d
  worker:
    profiles: ["worker"]
    build:
      context: .
      args:
        WITH_OCTAVE: ${WITH_OCTAVE:-0}
    command: ["sh", "-c", "exec uvicorn apps.worker.main:app --host 0.0.0.0 --port 8100"]
    environment:
      EXEC_WORKER_TOKEN: ${EXEC_WORKER_TOKEN:-}
      EXEC_ALLOW_NETWORK: "0"
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    # Not published: only LabForge talks to it.

  # HTTPS on your own server (docs/deployment.md):
  #   LABFORGE_DOMAIN=labforge.in docker compose --profile https up -d
  caddy:
    profiles: ["https"]
    image: caddy:2
    environment:
      LABFORGE_DOMAIN: ${LABFORGE_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/vps/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    depends_on: [labforge]

volumes:
  labforge-data:
  caddy-data:
  caddy-config:
